plugins {
    alias(libs.plugins.android.application)
    id("com.google.gms.google-services")
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
}

android {
    namespace 'lk.jiat.shapeway'
    compileSdk 36


    buildFeatures {
        buildConfig true
        // ...
    }

    defaultConfig {
        applicationId "lk.jiat.shapeway"
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"


        def apiKey = project.findProperty("FIREBASE_WEB_API_KEY") ?: ""

        buildConfigField "String", "FIREBASE_WEB_API_KEY", "\"${apiKey}\""
    }


    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }


    buildFeatures {
        buildConfig true
        viewBinding true

    }


}


dependencies {
    implementation 'com.google.firebase:firebase-messaging'

    implementation libs.google.maps.services
    implementation libs.slf4j.simple

    implementation(libs.android.maps.utils)

    implementation libs.okhttp3.okhttp
    implementation libs.okhttp3.logging.interceptor
    implementation libs.converter.gson.v300


    implementation(libs.retrofit)

    implementation libs.play.services.location
    implementation libs.play.services.maps

    implementation libs.payhere.android.sdk
    implementation libs.gson

    implementation libs.viewpager2

    implementation libs.core
    implementation libs.navigation.fragment
    implementation libs.navigation.ui

    annotationProcessor libs.compiler.v505
    implementation libs.appcompat.v170
    implementation libs.activity.v190
    implementation libs.fragment

    implementation libs.cardview
    implementation libs.glide
    annotationProcessor libs.compiler

    implementation libs.material.v1120

    compileOnly(libs.lombok)
    annotationProcessor(libs.lombok)

    implementation libs.firebase.storage
    implementation(libs.firebase.firestore)
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.analytics
    implementation(libs.firebase.auth)


    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.google.firebase.auth
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation libs.picasso
    implementation libs.material.v1110


}